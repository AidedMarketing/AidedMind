name: Editorial browser QA

on:
  pull_request:
    branches: [main]
    paths: ["web/**", ".github/workflows/editorial-qa.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/editorial-qa.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser QA tools
        run: npm install --no-save --ignore-scripts --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium and WebKit interaction, accessibility and offline checks
        run: node web/qa/editorial.mjs
      - name: Visual review images
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          images = [
              'chromium-320-light-library-viewport.png',
              'chromium-390-dark-library-viewport.png',
              'webkit-390-light-more-viewport.png',
              'chromium-390-dark-map-viewport.png',
              'chromium-1280-light-map-viewport.png',
              'webkit-1280-dark-map-viewport.png',
              'chromium-1280-light-breakdown-viewport.png',
              'webkit-390-light-links-viewport.png',
              'webkit-390-light-notes-viewport.png',
          ]
          for name in images:
              path = Path('qa-results') / name
              if not path.exists():
                  continue
              data = base64.b64encode(path.read_bytes()).decode('ascii')
              print('QA_IMAGE_BEGIN ' + name)
              for offset in range(0, len(data), 8000):
                  print('QA_IMAGE_DATA ' + data[offset:offset + 8000])
              print('QA_IMAGE_END ' + name)
          PY
      - name: Screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editorial-browser-qa
          path: qa-results/
