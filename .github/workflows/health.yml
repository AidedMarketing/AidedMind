# Daily check that the live app, its storage and the Claude API key all work.
# A failed scheduled run makes GitHub email the repository owner.
name: Health check

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::Set the APP_URL repository variable (Settings > Secrets and variables > Actions > Variables) to enable monitoring."
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 "$APP_URL/api/health?deep=1" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"ok":true'; then exit 0; fi
            sleep 60
          done
          echo "::error::AidedMind health check failed: $body"
          exit 1
