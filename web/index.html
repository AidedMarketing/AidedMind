<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1c1c27" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
    <meta name="description" content="AidedMind: save what you find, break it down for learning, and watch your knowledge map grow automatically.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AidedMind">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>AidedMind</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="app.css">
    <script src="vendor/Readability.js" defer></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="navbar-side" id="nav-left"></div>
        <div class="navbar-title" id="nav-title"></div>
        <div class="navbar-side right" id="nav-right"></div>
    </header>
    <div id="inbox-banner" class="inbox-banner" hidden></div>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Main">
        <a href="#/library" data-route="library"><span class="tab-icon" data-icon="library"></span><span>Library</span></a>
        <a href="#/graph" data-route="graph"><span class="tab-icon" data-icon="graph"></span><span>Explore</span></a>
        <a href="#/settings" data-route="settings"><span class="tab-icon" data-icon="settings"></span><span>More</span></a>
    </nav>
    <div id="sheet-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
