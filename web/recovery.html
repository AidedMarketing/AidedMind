<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Repair app loading — AidedMind</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/app.css">
    <script src="/api/recovery.js" defer></script>
</head>
<body>
    <main id="view">
        <h1>Repair app loading</h1>
        <p>Refresh AidedMind’s downloaded app files. Your saved pieces, notes and connection settings stay on this device.</p>
        <p>Keep this page open while the repair finishes.</p>
        <form id="repair-form" novalidate>
            <button id="repair" type="submit" class="btn primary block">Repair and open AidedMind</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
